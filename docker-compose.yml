name: gonext

# Host ports are deliberately offset from the defaults (3000/8080/3306/6379)
# so this stack can run alongside other local projects without clashing.
#   Frontend  http://localhost:3100
#   API       http://localhost:8180/api
#   MySQL     localhost:3317
#   Redis     localhost:6389

services:
  mysql:
    image: mysql:8.0
    container_name: gonext_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: go_db
      MYSQL_USER: go_user
      MYSQL_PASSWORD: go_password
      TZ: Asia/Bangkok
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3317:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # Runs only when the mysql_data volume is empty (first start / after `down -v`)
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    networks:
      - app-network
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_password" ]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: gonext_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6389:6379"
    volumes:
      - redis_data:/data
    networks:
      - app-network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  go-api:
    image: golang:1.26.1-alpine
    container_name: gonext_api
    restart: unless-stopped
    ports:
      - "8180:8080"
    environment:
      - DB_USER=go_user
      - DB_PASSWORD=go_password
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=go_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=super-secret-key-change-me
      - PORT=8080
      - ALLOWED_ORIGINS=http://localhost:3100
    working_dir: /app
    volumes:
      - ./GolangAPI:/app
      - go_modules:/go/pkg/mod
    command: sh -c "go install github.com/air-verse/air@v1.64.5 && go mod tidy && air --build.cmd 'go build -o tmp/main ./cmd/api/main.go' --build.bin './tmp/main'"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network

  nextjs-frontend:
    image: node:20.20.1-alpine
    container_name: gonext_ui
    restart: unless-stopped
    ports:
      - "3100:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8180/api # Called from the host browser, so it uses the host port
      - API_INTERNAL_URL=http://go-api:8080/api # Called by Next.js server components inside the Docker network
      - NEXT_TELEMETRY_DISABLED=1
    working_dir: /app
    volumes:
      - ./NextJSwGO:/app
      # Keep Linux node_modules in a volume so they never mix with a host (macOS) install
      - node_modules:/app/node_modules
      - next_cache:/app/.next
    command: sh -c "npm install && npm run dev"
    depends_on:
      - go-api
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  go_modules:
  node_modules:
  next_cache:
